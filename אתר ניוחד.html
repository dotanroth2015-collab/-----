<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח הצוות שלי</title>
    <!-- טעינת עיצוב Tailwind בצורה בטוחה -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Rubik', sans-serif; background-color: #EEF0EB; }
    </style>
</head>
<body class="text-[#1C2624] min-h-screen p-4">

    <!-- המבנה המעוצב של האתר, בדיוק כמו בקלאוד -->
    <div class="max-w-5xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-md">
        <div class="flex items-center justify-between mb-6 border-b pb-4 border-[#D9DED7]">
            <h1 class="text-3xl font-bold flex items-center gap-2 text-[#1F6F5C]">
                📅 לוח הצוות שלי
            </h1>
            <div class="bg-[#F5E6C8] text-[#1F6F5C] px-3 py-1 rounded-full text-sm font-medium">
                מצב מנהל עבודה
            </div>
        </div>
        
        <!-- כפתורי החלפת שבועות -->
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2">
                <button class="p-1.5 bg-white border border-[#D9DED7] rounded-md cursor-pointer hover:bg-gray-50">▶</button>
                <span class="text-sm font-medium min-w-[120px] text-center inline-block text-[#5B6863]">שבוע נוכחי</span>
                <button class="p-1.5 bg-white border border-[#D9DED7] rounded-md cursor-pointer hover:bg-gray-50">◀</button>
            </div>
        </div>

        <!-- טבלת המשמרות הגדולה והרחבה -->
        <div class="overflow-x-auto border border-[#D9DED7] rounded-lg">
            <table class="w-full text-sm border-collapse min-w-[700px]">
                <thead>
                    <tr class="bg-white">
                        <th class="text-right p-2.5 font-medium text-[#5B6863] border-b border-[#D9DED7]">עובד/ת</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">ראשון</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">שני</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">שלישי</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">רביעי</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">חמישי</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">שישי</th>
                        <th class="p-2.5 font-medium text-center text-[#5B6863] border-b border-[#D9DED7]">שבת</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="bg-white">
                        <td class="p-2.5 font-medium border-b border-[#D9DED7]">
                            <div class="flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-[#1F6F5C]"></span>
                                ישראל ישראלי
                            </div>
                        </td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7]">
                            <div class="bg-[#F5E6C8] border-r-3 border-[#1F6F5C] rounded p-1 text-xs text-right">
                                <div class="font-medium">08:00–16:00</div>
                                <div class="text-[#5B6863]">מהמשרד</div>
                            </div>
                        </td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                    </tr>
                    <tr class="bg-[#F8F9F6]">
                        <td class="p-2.5 font-medium border-b border-[#D9DED7]">
                            <div class="flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-[#1F6F5C]"></span>
                                נועה כהן
                            </div>
                        </td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7]">
                            <div class="bg-[#F5E6C8] border-r-3 border-[#1F6F5C] rounded p-1 text-xs text-right">
                                <div class="font-medium">09:00–17:00</div>
                                <div class="text-[#5B6863]">מהבית</div>
                            </div>
                        </td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                        <td class="p-1.5 text-center align-top border-b border-[#D9DED7] text-[#D9DED7]">+</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
