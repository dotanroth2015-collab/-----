/* פונקציות עוקפות חסימת דפדפנים (CORS Bypass Fetch) */
async function getShiftsFromCloud() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/shifts?select=*`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    return await res.json();
  } catch (e) { console.error(e); return []; }
}

async function saveShiftToCloud(employeeName, dayIndex, start, end, note) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/shifts`, {
      method: "POST",
      headers: { 
        "apikey": SUPABASE_ANON_KEY, 
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates"
      },
      body: JSON.stringify({
        employee_name: employeeName,
        day_index: dayIndex,
        start_time: start,
        end_time: end,
        note: note
      })
    });
  } catch (e) { console.error(e); }
}

async function deleteShiftFromCloud(employeeName, dayIndex) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/shifts?employee_name=eq.${encodeURIComponent(employeeName)}&day_index=eq.${dayIndex}`, {
      method: "DELETE",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
  } catch (e) { console.error(e); }
}

function makeIcon(symbol) {
  return function IconComp({ size = 16, className }) {
    return <span className={className} style={{ fontSize: size, lineHeight: 1, display: 'inline-block' }}>{symbol}</span>;
  };
}
const Calendar = makeIcon('📅');
const Users = makeIcon('👥');
const ChevronRight = makeIcon('›');
const ChevronLeft = makeIcon('‹');
const X = makeIcon('✕');

const COLORS = {
  bg: '#EEF0EB', surface: '#FFFFFF', ink: '#1C2624', inkSoft: '#5B6863',
  primary: '#1F6F5C', accentSoft: '#F5E6C8', line: '#D9DED7', danger: '#C1443B',
};

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

function ScheduleTab({ roster, weekDays, weekStart, setWeekStart, shiftFor, saveShift, isManager, editingCell, setEditingCell }) {
  const [form, setForm] = useState({ start: '09:00', end: '17:00', note: '' });
  useEffect(() => {
    if (editingCell) {
      const existing = shiftFor(editingCell.employeeName, editingCell.dayIndex);
      setForm(existing ? { start: existing.start, end: existing.end, note: existing.note || '' } : { start: '09:00', end: '17:00', note: '' });
    }
  }, [editingCell]);
  const rangeLabel = `${weekDays[0].toLocaleDateString('he-IL', { day: 'numeric', month: 'short' })} – ${weekDays[6].toLocaleDateString('he-IL', { day: 'numeric', month: 'short' })}`;
  return (
    <div>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <button onClick={() => setWeekStart(addDays(weekStart, -7))} style={{ border: `1px solid ${COLORS.line}`, borderRadius: '6px' }} className="p-1.5 cursor-pointer bg-white"><ChevronRight size={16} /></button>
          <span style={{ color: COLORS.inkSoft }} className="text-sm font-medium min-w-[120px] text-center inline-block">{rangeLabel}</span>
          <button onClick={() => setWeekStart(addDays(weekStart, 7))} style={{ border: `1px solid ${COLORS.line}`, borderRadius: '6px' }} className="p-1.5 cursor-pointer bg-white"><ChevronLeft size={16} /></button>
        </div>
      </div>
      <div className="overflow-x-auto" style={{ border: `1px solid ${COLORS.line}`, borderRadius: '8px' }}>
        <table className="w-full text-sm" style={{ borderCollapse: 'collapse', minWidth: '700px' }}>
          <thead>
            <tr style={{ background: COLORS.surface }}>
              <th style={{ borderBottom: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }} className="text-right p-2.5 font-medium">עובד/ת</th>
              {weekDays.map((d, i) => (
                <th key={i} style={{ borderBottom: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }} className="p-2.5 font-medium text-center">
                  <div>{DAY_NAMES[i]}</div>
                  <div style={{ fontWeight: 400, fontSize: '11px' }}>{d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' })}</div>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {roster.map((emp, ri) => (
              <tr key={emp.id} style={{ background: ri % 2 === 0 ? COLORS.surface : '#F8F9F6' }}>
                <td style={{ borderBottom: `1px solid ${COLORS.line}` }} className="p-2.5 font-medium">{emp.name}</td>
                {weekDays.map((d, di) => {
                  const shift = shiftFor(emp.name, di);
                  return (
                    <td key={di} onClick={() => setEditingCell({ employeeName: emp.name, dayIndex: di })}
                      style={{ borderBottom: `1px solid ${COLORS.line}` }} className="p-1.5 text-center align-top cursor-pointer">
                      {shift ? (
                        <div style={{ background: COLORS.accentSoft, borderRight: `3px solid ${COLORS.primary}`, borderRadius: '4px' }} className="px-2 py-1 text-xs text-right">
                          <div className="font-medium">{shift.start}–{shift.end}</div>
                          {shift.note && <div style={{ color: COLORS.inkSoft }}>{shift.note}</div>}
                        </div>
                      ) : <span style={{ color: COLORS.line }} className="text-xs">+</span >}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {editingCell && (
        <div style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, borderRadius: '8px' }} className="mt-4 p-4 max-w-sm">
          <div className="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">משמרת: {editingCell.employeeName} · {DAY_NAMES[editingCell.dayIndex]}</h3>
            <button onClick={() => setEditingCell(null)} class="cursor-pointer"><X size={16} /></button>
          </div>
          <div className="flex gap-2 mb-2">
            <div className="flex-1">
              <label style={{ color: COLORS.inkSoft }} className="text-xs block mb-1">התחלה</label>
              <input type="time" value={form.start} onChange={e => setForm({ ...form, start: e.target.value })} style={{ border: `1px solid ${COLORS.line}`, borderRadius: '6px' }} className="w-full px-2 py-1.5 text-sm" />
            </div>
            <div className="flex-1">
              <label style={{ color: COLORS.inkSoft }} className="text-xs block mb-1">סיום</label>
              <input type="time" value={form.end} onChange={e => setForm({ ...form, end: e.target.value })} style={{ border: `1px solid ${COLORS.line}`, borderRadius: '6px' }} className="w-full px-2 py-1.5 text-sm" />
            </div>
          </div>
          <div className="mb-3">
            <label style={{ color: COLORS.inkSoft }} className="text-xs block mb-1">הערה</label>
            <input type="text" placeholder="למשל: מהבית" value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} style={{ border: `1px solid ${COLORS.line}`, borderRadius: '6px' }} className="w-full px-2 py-1.5 text-sm" />
          </div>
          <div className="flex gap-2 justify-end">
            <button onClick={() => saveShift(null)} style={{ color: COLORS.danger }} className="text-xs px-2 py-1.5 font-medium cursor-pointer">מחק משמרת</button>
            <button onClick={() => saveShift({ start: form.start, end: form.end, note: form.note })} style={{ background: COLORS.primary, color: COLORS.surface, borderRadius: '6px' }} className="text-xs px-3 py-1.5 font-medium cursor-pointer">שמור</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [weekStart, setWeekStart] = useState(getWeekStart(new Date()));
  const weekDays = [...Array(7)].map((_, i) => addDays(weekStart, i));
  const [roster] = useState([{ id: '1', name: 'ישראל ישראלי' }, { id: '2', name: 'נועה כהן' }]);
  const [shifts, setShifts] = useState({});
  const [editingCell, setEditingCell] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    async function loadShifts() {
      setLoading(true);
      const data = await getShiftsFromCloud();
      if (Array.isArray(data)) {
        const shiftsMap = {};
        data.forEach(s => {
          shiftsMap[`${s.employee_name}-${s.day_index}`] = { start: s.start_time, end: s.end_time, note: s.note };
        });
        setShifts(shiftsMap);
      }
      setLoading(false);
    }
    loadShifts();
  }, [weekStart]);
